name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check deployment key
        env:
          SPREADJS_DISTRIBUTION_KEY: ${{ secrets.SPREADJS_DISTRIBUTION_KEY }}
        run: |
          if [ -z "$SPREADJS_DISTRIBUTION_KEY" ]; then
            echo "Set the SPREADJS_DISTRIBUTION_KEY repository secret for the Pages hostname." >&2
            exit 1
          fi
      - name: Build workbook
        env:
          VITE_SPREADJS_LICENSE_KEY: ${{ secrets.SPREADJS_DISTRIBUTION_KEY }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
